name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas pyarrow pyyaml soundfile huggingface_hub
      - name: Test without models or downloads
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s generation/tests -v
          python metrics/tests/test_diversity_metrics.py
          python - <<'PY'
          import subprocess
          for file in subprocess.check_output(['git', 'ls-files', '*.sh'], text=True).splitlines():
              subprocess.run(['bash', '-n', file], check=True)
          PY
